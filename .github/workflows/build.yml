name: Build rules

on:
  workflow_dispatch:
  schedule:
    - cron: "25 3 * * *"
  push:
    branches: ["main"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install mihomo
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.30/mihomo-linux-amd64-v1.19.30.gz" -o mihomo.gz
          gzip -d mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/mihomo

      - name: Check mihomo version
        run: mihomo -v

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build MRS rules
        run: |
          python scripts/convert.py examples/my-rules.yaml \
            --base-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}"

      - name: Validate generated rules
        run: |
          test -f dist/generated/mihomo-rules.yaml
          test -f dist/domain/openai.mrs
          grep -q -- '- +.chatgpt.com' dist/source/domain/openai.yaml
          ! grep -q -- '- .chatgpt.com' dist/source/domain/openai.yaml

      - name: Commit generated dist
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "build: update generated mihomo rules"
          file_pattern: dist
