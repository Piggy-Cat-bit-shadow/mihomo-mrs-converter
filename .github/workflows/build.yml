name: Build rules

on:
  workflow_dispatch:
  schedule:
    - cron: "25 3 * * *"
  push:
    branches: ["main"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install mihomo
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.30/mihomo-linux-amd64-v1.19.30.gz" -o mihomo.gz
          gzip -d mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/mihomo

      - name: Check mihomo version
        run: mihomo -v

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Run complete-config integration test
        run: python -m unittest tests.test_convert.CompleteConfigRefreshTest.test_two_cli_runs_remove_stale_state_and_are_idempotent

      - name: Build MRS rules
        run: |
          python scripts/convert.py examples/my-rules.yaml \
            --base-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}"

      - name: Validate generated rules
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          from scripts.convert import find_ruleset_refs

          root = Path("dist")

          def validate(path, require_no_orphans=False):
              data = yaml.safe_load(path.read_text(encoding="utf-8"))
              providers = data["rule-providers"]
              paths = {}
              used = set()
              for name, provider in providers.items():
                  provider_path = provider["path"]
                  if provider_path in paths:
                      raise SystemExit(f"{path}: duplicate provider path {provider_path}")
                  paths[provider_path] = name
              for rule in data["rules"]:
                  for provider_name in find_ruleset_refs(rule):
                      if provider_name not in providers:
                          raise SystemExit(f"{path}: missing provider {provider_name}")
                      used.add(provider_name)
              for name, provider in providers.items():
                  url = provider["url"]
                  if "/dist/" in url:
                      artifact = root / url.split("/dist/", 1)[1]
                      if not artifact.exists():
                          raise SystemExit(f"{path}: missing artifact {artifact}")
              if require_no_orphans:
                  orphaned = set(providers) - used
                  if orphaned:
                      raise SystemExit(f"{path}: orphan providers {sorted(orphaned)}")

          validate(Path("dist/generated/mihomo-rules.yaml"), require_no_orphans=True)
          if any((Path("dist") / suite).exists() for suite in ("unmerged", "merged", "merged-dedup")):
              raise SystemExit("obsolete intermediate dist directory exists")
          for obsolete in ("mihomo-rules-merged.yaml", "mihomo-rules-merged-dedup.yaml"):
              if (Path("dist/generated") / obsolete).exists():
                  raise SystemExit(f"obsolete generated file exists: {obsolete}")
          if not Path("dist/generated/managed-state.yaml").exists():
              raise SystemExit("missing final managed state")
          egern = yaml.safe_load(Path("dist/generated/egern-rules.yaml").read_text(encoding="utf-8"))
          if not isinstance(egern, dict) or not isinstance(egern.get("rules"), list):
              raise SystemExit("invalid Egern rules output")
          referenced = set()
          allowed = {"domain_set", "domain_suffix_set", "domain_keyword_set", "ip_cidr_set", "ip_cidr6_set", "geoip_set", "protocol_set", "dest_port_set", "asn_set"}
          for item in egern["rules"]:
              if "rule_set" in item:
                  rule_set = item["rule_set"]
                  match = rule_set["match"]
                  if not match.startswith("http") or "/dist/egern/" not in match:
                      raise SystemExit(f"invalid Egern rule_set URL: {match}")
                  artifact = root / match.split("/dist/", 1)[1]
                  if not artifact.exists():
                      raise SystemExit(f"missing Egern artifact: {artifact}")
                  referenced.add(artifact.name)
          for artifact in Path("dist/egern").glob("*.yaml"):
              data = yaml.safe_load(artifact.read_text(encoding="utf-8"))
              if not isinstance(data, dict) or not set(data) <= allowed:
                  raise SystemExit(f"invalid Egern Rule Set fields: {artifact}")
              for values in data.values():
                  if any(isinstance(value, str) and value.startswith("+.") for value in values):
                      raise SystemExit(f"Egern suffix still contains '+.': {artifact}")
          if len(referenced) != len([*Path("dist/egern").glob("*.yaml")]):
              raise SystemExit("stale or unreferenced Egern Rule Set artifact")
          PY
          if [ -f dist/source/domain/openai.yaml ]; then
            grep -q -- '- +.chatgpt.com' dist/source/domain/openai.yaml
            ! grep -q -- '- .chatgpt.com' dist/source/domain/openai.yaml
          fi

      - name: Commit generated dist
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "build: update generated mihomo rules"
          file_pattern: dist
