name: Build rules

on:
  workflow_dispatch:
  schedule:
    - cron: "25 3 * * *"
  push:
    branches: ["main"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install mihomo
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.30/mihomo-linux-amd64-v1.19.30.gz" -o mihomo.gz
          gzip -d mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/mihomo

      - name: Check mihomo version
        run: mihomo -v

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build MRS rules
        run: |
          python scripts/convert.py examples/my-rules.yaml \
            --base-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}"

      - name: Validate generated rules
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          root = Path("dist")

          def validate(path, require_no_orphans=False):
              data = yaml.safe_load(path.read_text(encoding="utf-8"))
              providers = data["rule-providers"]
              paths = {}
              used = set()
              for name, provider in providers.items():
                  provider_path = provider["path"]
                  if provider_path in paths:
                      raise SystemExit(f"{path}: duplicate provider path {provider_path}")
                  paths[provider_path] = name
              for rule in data["rules"]:
                  if not isinstance(rule, str):
                      continue
                  parts = [part.strip() for part in rule.split(",")]
                  if parts and parts[0].upper() == "RULE-SET":
                      if parts[1] not in providers:
                          raise SystemExit(f"{path}: missing provider {parts[1]}")
                      used.add(parts[1])
              for name, provider in providers.items():
                  url = provider["url"]
                  if "/dist/" in url:
                      artifact = root / url.split("/dist/", 1)[1]
                      if not artifact.exists():
                          raise SystemExit(f"{path}: missing artifact {artifact}")
              if require_no_orphans:
                  orphaned = set(providers) - used
                  if orphaned:
                      raise SystemExit(f"{path}: orphan providers {sorted(orphaned)}")

          validate(Path("dist/generated/mihomo-rules.yaml"))
          validate(Path("dist/generated/mihomo-rules-merged.yaml"), require_no_orphans=True)
          PY
          grep -q -- '- +.chatgpt.com' dist/source/domain/openai.yaml
          ! grep -q -- '- .chatgpt.com' dist/source/domain/openai.yaml

      - name: Commit generated dist
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "build: update generated mihomo rules"
          file_pattern: dist
