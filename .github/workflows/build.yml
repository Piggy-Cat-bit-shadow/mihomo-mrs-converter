name: Build rules

on:
  workflow_dispatch:
  schedule:
    - cron: "25 3 1,6,11,16,21,26 * *"
  push:
    branches: ["main"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  SING_BOX_VERSION: "1.14.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Install mihomo
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.30/mihomo-linux-amd64-v1.19.30.gz" -o mihomo.gz
          gzip -d mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/mihomo
          mihomo -v
      - name: Install sing-box
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz" -o sing-box.tar.gz
          tar -xzf sing-box.tar.gz
          install "sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box" /usr/local/bin/sing-box
          sing-box version
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Build generated rules
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/convert.py examples/my-rules.yaml --base-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}"
      - name: Audit generated artifacts
        run: python -m converter.audit dist --mihomo mihomo
      - name: Validate Sing-box rule sets
        run: |
          set -euo pipefail
          for srs in dist/singbox/*.srs dist/dns/singbox/*.srs; do
            sing-box rule-set decompile "$srs" -o /tmp/$(basename "$srs").json
            python -m json.tool /tmp/$(basename "$srs").json >/dev/null
          done
      - name: Check diff
        run: git diff --check
      - name: Commit generated dist
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "build: update generated rules"
          file_pattern: dist .state/managed-state.yaml
