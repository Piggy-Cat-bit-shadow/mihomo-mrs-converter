name: Build rules

on:
  workflow_dispatch:
  schedule:
    - cron: "25 3 * * *"
  push:
    branches: ["main"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install mihomo
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.30/mihomo-linux-amd64-v1.19.30.gz" -o mihomo.gz
          gzip -d mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/mihomo

      - name: Check mihomo version
        run: mihomo -v

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build generated rules
        run: |
          python scripts/convert.py examples/my-rules.yaml \
            --base-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}"

      - name: Validate generated rules
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          from scripts.convert import find_ruleset_refs

          root = Path("dist")

          def validate(path, require_no_orphans=False):
              data = yaml.safe_load(path.read_text(encoding="utf-8"))
              providers = data["rule-providers"]
              paths = {}
              used = set()
              for name, provider in providers.items():
                  provider_path = provider["path"]
                  if provider_path in paths:
                      raise SystemExit(f"{path}: duplicate provider path {provider_path}")
                  paths[provider_path] = name
              for rule in data["rules"]:
                  for provider_name in find_ruleset_refs(rule):
                      if provider_name not in providers:
                          raise SystemExit(f"{path}: missing provider {provider_name}")
                      used.add(provider_name)
              for name, provider in providers.items():
                  url = provider["url"]
                  if "/dist/" in url:
                      artifact = root / url.split("/dist/", 1)[1]
                      if not artifact.exists():
                          raise SystemExit(f"{path}: missing artifact {artifact}")
              if require_no_orphans:
                  orphaned = set(providers) - used
                  if orphaned:
                      raise SystemExit(f"{path}: orphan providers {sorted(orphaned)}")

          validate(Path("dist/generated/mihomo-rules.yaml"), require_no_orphans=True)
          if any((Path("dist") / suite).exists() for suite in ("unmerged", "merged", "merged-dedup")):
              raise SystemExit("obsolete intermediate dist directory exists")
          for obsolete in ("mihomo-rules-merged.yaml", "mihomo-rules-merged-dedup.yaml"):
              if (Path("dist/generated") / obsolete).exists():
                  raise SystemExit(f"obsolete generated file exists: {obsolete}")
          if not Path(".state/managed-state.yaml").exists():
              raise SystemExit("missing final managed state")
          egern = yaml.safe_load(Path("dist/generated/egern-rules.yaml").read_text(encoding="utf-8"))
          if not isinstance(egern, dict) or not isinstance(egern.get("rules"), list):
              raise SystemExit("invalid Egern rules output")
          referenced = set()
          allowed = {"domain_set", "domain_suffix_set", "domain_keyword_set", "domain_regex_set", "domain_wildcard_set", "ip_cidr_set", "ip_cidr6_set", "asn_set", "geoip_set", "protocol_set", "dest_port_set", "no_resolve"}
          def validate_egern_rule(item, context, nested=False):
              if not isinstance(item, dict) or len(item) != 1:
                  raise SystemExit(f"invalid Egern rule: {context}")
              kind, body = next(iter(item.items()))
              if not isinstance(body, dict):
                  raise SystemExit(f"invalid Egern {kind} body: {context}")
              if kind == "rule_set":
                  match = body.get("match")
                  if not isinstance(match, str) or not match.startswith("http") or "/dist/egern/" not in match:
                      raise SystemExit(f"invalid Egern rule_set URL: {match}")
                  if not nested and (not isinstance(body.get("policy"), str) or not body["policy"]):
                      raise SystemExit(f"invalid Egern rule_set policy: {context}")
                  if body.get("update_interval") != 172800:
                      raise SystemExit(f"invalid Egern rule_set update_interval: {context}")
                  artifact = root / match.split("/dist/", 1)[1]
                  if not artifact.exists():
                      raise SystemExit(f"missing Egern artifact: {artifact}")
                  referenced.add(artifact.name)
              elif kind == "and":
                  matches = body.get("match")
                  if not isinstance(matches, list) or not matches:
                      raise SystemExit(f"invalid Egern and match: {context}")
                  if not isinstance(body.get("policy"), str) or not body["policy"]:
                      raise SystemExit(f"invalid Egern and policy: {context}")
                  for nested in matches:
                      validate_egern_rule(nested, f"{context}.and", nested=True)
              elif kind == "protocol":
                  if body.get("match") not in {"udp", "tcp"}:
                      raise SystemExit(f"invalid Egern protocol: {context}")
                  if not nested and (not isinstance(body.get("policy"), str) or not body["policy"]):
                      raise SystemExit(f"invalid Egern protocol policy: {context}")
              elif kind == "default":
                  if not isinstance(body.get("policy"), str) or not body["policy"]:
                      raise SystemExit(f"invalid Egern default policy: {context}")
              else:
                  raise SystemExit(f"invalid Egern rule kind: {kind}")

          for index, item in enumerate(egern["rules"]):
              validate_egern_rule(item, f"rules[{index}]")
          for index, item in enumerate(egern["rules"]):
              if "default" in item and index != len(egern["rules"]) - 1:
                  raise SystemExit("Egern default rule must be last")
          for artifact in Path("dist/egern").glob("*.yaml"):
              data = yaml.safe_load(artifact.read_text(encoding="utf-8"))
              if not isinstance(data, dict) or not set(data) <= allowed:
                  raise SystemExit(f"invalid Egern Rule Set fields: {artifact}")
              if "no_resolve" in data and data["no_resolve"] is not True:
                  raise SystemExit(f"invalid no_resolve value: {artifact}")
              for field, values in data.items():
                  if field == "no_resolve":
                      continue
                  if not isinstance(values, list):
                      raise SystemExit(f"Egern Rule Set field is not a list: {artifact}")
                  if any(isinstance(value, str) and value.startswith("+.") for value in values):
                      raise SystemExit(f"Egern suffix still contains '+.': {artifact}")
                  if field == "ip_cidr_set":
                      import ipaddress
                      for value in values:
                          try:
                              if ipaddress.ip_network(value, strict=False).version != 4:
                                  raise SystemExit(f"invalid IPv4 Egern CIDR: {artifact}: {value}")
                          except ValueError:
                              raise SystemExit(f"invalid IPv4 Egern CIDR: {artifact}: {value}")
                  if field == "ip_cidr6_set":
                      import ipaddress
                      for value in values:
                          try:
                              if ipaddress.ip_network(value, strict=False).version != 6:
                                  raise SystemExit(f"invalid IPv6 Egern CIDR: {artifact}: {value}")
                          except ValueError:
                              raise SystemExit(f"invalid IPv6 Egern CIDR: {artifact}: {value}")
          if len(referenced) != len([*Path("dist/egern").glob("*.yaml")]):
              raise SystemExit("stale or unreferenced Egern Rule Set artifact")
          PY
          if [ -f dist/source/domain/openai.yaml ]; then
            grep -q -- '- +.chatgpt.com' dist/source/domain/openai.yaml
            ! grep -q -- '- .chatgpt.com' dist/source/domain/openai.yaml
          fi

      - name: Commit generated dist
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "build: update generated rules"
          file_pattern: dist .state/managed-state.yaml
