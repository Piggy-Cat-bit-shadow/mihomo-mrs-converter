rules:
- rule_set:
    match: https://raw.githubusercontent.com/Piggy-Cat-bit-shadow/mihomo-mrs-converter/main/dist/egern/Direct.yaml
    policy: 🏠 国内流量
    update_interval: 172800
- rule_set:
    match: https://raw.githubusercontent.com/Piggy-Cat-bit-shadow/mihomo-mrs-converter/main/dist/egern/Direct-no-resolve.yaml
    policy: 🏠 国内流量
    update_interval: 172800
- and:
    match:
    - rule_set:
        match: https://raw.githubusercontent.com/Piggy-Cat-bit-shadow/mihomo-mrs-converter/main/dist/egern/AI.yaml
        update_interval: 172800
    - protocol:
        match: udp
    policy: REJECT
- rule_set:
    match: https://raw.githubusercontent.com/Piggy-Cat-bit-shadow/mihomo-mrs-converter/main/dist/egern/AI.yaml
    policy: 🤖 AI
    update_interval: 172800
- rule_set:
    match: https://raw.githubusercontent.com/Piggy-Cat-bit-shadow/mihomo-mrs-converter/main/dist/egern/Global.yaml
    policy: 🌍 国外流量
    update_interval: 172800
- rule_set:
    match: https://raw.githubusercontent.com/Piggy-Cat-bit-shadow/mihomo-mrs-converter/main/dist/egern/Global-no-resolve.yaml
    policy: 🌍 国外流量
    update_interval: 172800
- rule_set:
    match: https://raw.githubusercontent.com/Piggy-Cat-bit-shadow/mihomo-mrs-converter/main/dist/egern/China.yaml
    policy: 🏠 国内流量
    update_interval: 172800
- rule_set:
    match: https://raw.githubusercontent.com/Piggy-Cat-bit-shadow/mihomo-mrs-converter/main/dist/egern/China-no-resolve.yaml
    policy: 🏠 国内流量
    update_interval: 172800
- default:
    policy: 🌍 国外流量
