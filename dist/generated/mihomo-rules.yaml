rule-providers:
  Direct-domain:
    behavior: domain
    interval: 172800
    type: http
    format: mrs
    url: https://raw.githubusercontent.com/Piggy-Cat-bit-shadow/mihomo-mrs-converter/main/dist/domain/Direct-domain.mrs
    path: ./ruleset/Direct-domain.mrs
  Direct-classical:
    behavior: classical
    interval: 172800
    type: http
    format: yaml
    url: https://raw.githubusercontent.com/Piggy-Cat-bit-shadow/mihomo-mrs-converter/main/dist/classical/Direct-classical.yaml
    path: ./ruleset/Direct-classical.yaml
  AI-domain:
    behavior: domain
    interval: 172800
    type: http
    format: mrs
    url: https://raw.githubusercontent.com/Piggy-Cat-bit-shadow/mihomo-mrs-converter/main/dist/domain/AI-domain.mrs
    path: ./ruleset/AI-domain.mrs
  AI-classical:
    behavior: classical
    interval: 172800
    type: http
    format: yaml
    url: https://raw.githubusercontent.com/Piggy-Cat-bit-shadow/mihomo-mrs-converter/main/dist/classical/AI-classical.yaml
    path: ./ruleset/AI-classical.yaml
  AI-ip:
    behavior: ipcidr
    interval: 172800
    type: http
    format: mrs
    url: https://raw.githubusercontent.com/Piggy-Cat-bit-shadow/mihomo-mrs-converter/main/dist/ipcidr/AI-ip.mrs
    path: ./ruleset/AI-ip.mrs
  Global-domain:
    behavior: domain
    interval: 172800
    type: http
    format: mrs
    url: https://raw.githubusercontent.com/Piggy-Cat-bit-shadow/mihomo-mrs-converter/main/dist/domain/Global-domain.mrs
    path: ./ruleset/Global-domain.mrs
  Global-classical:
    behavior: classical
    interval: 172800
    type: http
    format: yaml
    url: https://raw.githubusercontent.com/Piggy-Cat-bit-shadow/mihomo-mrs-converter/main/dist/classical/Global-classical.yaml
    path: ./ruleset/Global-classical.yaml
  Global-ip:
    behavior: ipcidr
    interval: 172800
    type: http
    format: mrs
    url: https://raw.githubusercontent.com/Piggy-Cat-bit-shadow/mihomo-mrs-converter/main/dist/ipcidr/Global-ip.mrs
    path: ./ruleset/Global-ip.mrs
  China-domain:
    behavior: domain
    interval: 172800
    type: http
    format: mrs
    url: https://raw.githubusercontent.com/Piggy-Cat-bit-shadow/mihomo-mrs-converter/main/dist/domain/China-domain.mrs
    path: ./ruleset/China-domain.mrs
  China-classical:
    behavior: classical
    interval: 172800
    type: http
    format: yaml
    url: https://raw.githubusercontent.com/Piggy-Cat-bit-shadow/mihomo-mrs-converter/main/dist/classical/China-classical.yaml
    path: ./ruleset/China-classical.yaml
  China-ip:
    behavior: ipcidr
    interval: 172800
    type: http
    format: mrs
    url: https://raw.githubusercontent.com/Piggy-Cat-bit-shadow/mihomo-mrs-converter/main/dist/ipcidr/China-ip.mrs
    path: ./ruleset/China-ip.mrs
rules:
- RULE-SET,Direct-domain,DIRECT
- RULE-SET,Direct-classical,DIRECT,no-resolve
- SUB-RULE,(RULE-SET,AI-domain),AI-Routing
- SUB-RULE,(RULE-SET,AI-classical,no-resolve),AI-Routing
- SUB-RULE,(RULE-SET,AI-ip,no-resolve),AI-Routing
- RULE-SET,Global-domain,🌍 国外流量
- RULE-SET,Global-classical,🌍 国外流量,no-resolve
- RULE-SET,Global-ip,🌍 国外流量,no-resolve
- RULE-SET,China-domain,DIRECT
- RULE-SET,China-classical,DIRECT,no-resolve
- RULE-SET,China-ip,DIRECT,no-resolve
- MATCH,🌍 国外流量
sub-rules:
  AI-Routing:
  - NETWORK,UDP,REJECT
  - MATCH,🤖 AI
